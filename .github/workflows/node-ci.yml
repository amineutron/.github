# Workflow réutilisable : npm ci, build, tests, audit (haute/critique), garde-fou anti chemins personnels.
name: node-ci
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      test:
        type: boolean
        default: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - if: ${{ inputs.test }}
        run: npm test --if-present
      - name: Audit (haute et critique)
        run: npm audit --audit-level=high
  no-personal-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          hits=$(grep -rIlE '/home/[a-z]+/|192\.168\.[0-9]+\.[0-9]+' --exclude-dir=.git --exclude-dir=docs --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=android . || true)
          if [ -n "$hits" ]; then echo "Chemins ou adresses personnels trouvés :"; echo "$hits"; exit 1; fi
